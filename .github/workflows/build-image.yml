env:
  DOCKER_IMAGE_NAME_NODE: node-app
  DOCKER_IMAGE_NAME_DB: db-app
name: Deploy images to Amazon ECR
run-name: Building Docker Images
on: [push]
jobs:
  BuildFront-EndDockerImage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build --tag ${{env.DOCKER_IMAGE_NAME_NODE}}:$(date +%s) ./app
      - name: List files
        run: ls -la
      - name: Build DB Docker Image
        working-directory: ./config
        run: docker build --tag ${{env.DOCKER_IMAGE_NAME_DB}}:$(date +%s) .



