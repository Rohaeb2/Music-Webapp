env:
  DOCKER_IMAGE_NAME_NODE: node-app
  DOCKER_IMAGE_NAME_DB: db-app
name: Deploy images to Amazon ECR
run-name: Building Docker Images
on: [push]
jobs:
  BuildNode-appDockerImage:
    runs-on: ubuntu-latest

    permissions: 
      id-token: write
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: See what Directory
        run: ls -la
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::742721334630:role/wavelength-github-actions
          aws-region: us-east-1   
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'false'
      - name: reclass user
        run: chmod u+x ./scripts/build-and-push.sh
      - name: Run Build and push Script
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: node-web-app
          IMAGE_TAG: ${{ github.sha }}
        run: ./scripts/build-and-push.sh node-app ./app
      - name: Build DB Docker Image
        working-directory: ./app/config
        run: |
          docker build --tag ${{env.DOCKER_IMAGE_NAME_DB}}:$(date +%s) .
          ls -la



