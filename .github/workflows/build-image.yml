env:
  DOCKER_IMAGE_NAME: Node-App
name: Deploy images to Amazon ECR
run-name: Building Docker Images
on: [push]
jobs:
  BuildFront-EndDockerImage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: List files
        run: ls -la
      - name: Build Docker Image
        run: docker build --tag ${{env.DOCKER_IMAGE_NAME}}:$(date +%s) ./app


