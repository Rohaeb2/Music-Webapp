env:
  DOCKER_IMAGE_NAME_NODE: node-app
  DOCKER_IMAGE_NAME_DB: db-app
name: Deploy images to Amazon ECR
run-name: Building Docker Images
on: [push]
jobs:
  BuildNode-appDockerImage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-access-key-id: ${{ secrects.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrects.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          role-to-assume: ${{ secrects.AWS_ROLE_TO_ASSUME }}   
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker Image
        run: ../scripts/build-and-push.sh node-app ./app
      - name: Build DB Docker Image
        working-directory: ./app/config
        run: |
          docker build --tag ${{env.DOCKER_IMAGE_NAME_DB}}:$(date +%s) .
          ls -la



